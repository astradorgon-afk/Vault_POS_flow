name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Pos.Client targets Android and Windows and needs the MAUI workloads,
      # which this runner does not have; the build-client jobs build it.
      # Removing it from this checkout's solution, rather than listing what to
      # build, means any project added later is still built and tested here.
      - name: Leave the device client to its own job
        run: dotnet sln VaultFlow.slnx remove src/Pos.Client/Pos.Client.csproj

      - name: Restore
        run: dotnet restore VaultFlow.slnx

      # Warnings are errors, and NU1903 fails the build on a package with a
      # published advisory, so a vulnerable dependency cannot merge unnoticed.
      - name: Build
        run: dotnet build VaultFlow.slnx --no-restore --configuration Release

      # Docker is available on this runner, so the Testcontainers suites that
      # skip locally do run here. They are the only place the database triggers
      # and role grants are actually exercised.
      - name: Test
        run: >-
          dotnet test VaultFlow.slnx
          --no-build --configuration Release
          --settings coverlet.runsettings
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/test-results

      # Collecting coverage and never looking at it is how a suite rots while
      # the badge stays green. The floors live in the script, a couple of points
      # under what the suite covers today, so only a real regression trips them.
      - name: Check coverage floors
        run: pwsh ./scripts/check-coverage.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results

  # DEPLOYMENT.md §8: the client builds only once the shared projects have
  # built and passed their tests, Android on Linux and Windows on Windows.
  # Workloads are pinned to the workload set matching global.json, so a new MAUI
  # or Android release cannot change these builds without a commit. Release runs
  # the Android trimmer, whose warnings are errors like every other warning.
  build-client-android:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Installed under the runner's temp directory rather than /usr/share/dotnet,
      # so installing a workload needs no elevated rights.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          global-json-file: global.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android --version 10.0.301

      # Tops up the runner's Android SDK with what this target needs, so the
      # build does not depend on which platforms the runner image carries.
      - name: Install Android dependencies
        run: >-
          dotnet build src/Pos.Client/Pos.Client.csproj
          -t:InstallAndroidDependencies
          -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:JavaSdkDirectory="$JAVA_HOME"
          -p:AcceptAndroidSDKLicenses=True

      - name: Build
        run: >-
          dotnet build src/Pos.Client/Pos.Client.csproj
          --configuration Release
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:JavaSdkDirectory="$JAVA_HOME"

      # Package APK for direct distribution and AAB for Play Store.
      # If signing secrets are configured (ANDROID_KEYSTORE_* env vars), builds
      # a signed package; otherwise builds unsigned for development testing.
      # The keystore is provided via GitHub Secrets in the workflow environment.
      - name: Package APK (unsigned)
        if: github.event_name == 'pull_request'
        run: >-
          dotnet build src/Pos.Client/Pos.Client.csproj
          --configuration Release
          -t:PackageApk
          -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:JavaSdkDirectory="$JAVA_HOME"

      - name: Package APK (signed)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          dotnet build src/Pos.Client/Pos.Client.csproj
          --configuration Release
          -t:PackageApk
          -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:JavaSdkDirectory="$JAVA_HOME"
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=true
          -p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS
          -p:AndroidSigningKeyPass=$ANDROID_KEY_PASSWORD
          -p:AndroidSigningStorePass=$ANDROID_KEYSTORE_PASSWORD

      - name: Package AAB (signed)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          dotnet build src/Pos.Client/Pos.Client.csproj
          --configuration Release
          -t:PackageAab
          -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:JavaSdkDirectory="$JAVA_HOME"
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=true
          -p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS
          -p:AndroidSigningKeyPass=$ANDROID_KEY_PASSWORD
          -p:AndroidSigningStorePass=$ANDROID_KEYSTORE_PASSWORD

      - name: Upload Android packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: |
            src/Pos.Client/bin/Release/net10.0-android/*.apk
            src/Pos.Client/bin/Release/net10.0-android/*.aab
          if-no-files-found: ignore

  build-client-windows:
    needs: build-and-test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install the MAUI Windows workload
        run: dotnet workload install maui-windows --version 10.0.301

      - name: Build
        run: >-
          dotnet build src/Pos.Client/Pos.Client.csproj
          --configuration Release
          --framework net10.0-windows10.0.19041.0

      # Package MSIX for Windows App Store or sideload distribution.
      # If signing certificate is configured (WINDOWS_CERTIFICATE_* env vars),
      # builds a signed MSIX; otherwise builds unsigned for development.
      # The certificate is provided via GitHub Secrets in PFX format.
      - name: Package MSIX (unsigned)
        if: github.event_name == 'pull_request'
        run: >-
          dotnet publish src/Pos.Client/Pos.Client.csproj
          --configuration Release
          --framework net10.0-windows10.0.19041.0
          --output artifacts/msix-unsigned

      - name: Package MSIX (signed)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.WINDOWS_CERTIFICATE_BASE64 != ''
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          # Decode the certificate from base64
          $cert = [System.Convert]::FromBase64String("$env:WINDOWS_CERTIFICATE_BASE64")
          [System.IO.File]::WriteAllBytes("$PWD\signing-cert.pfx", $cert)

          # Package with certificate signing (requires a custom MSBuild target or WixToolset)
          # For now, we publish and document the signing step
          dotnet publish src/Pos.Client/Pos.Client.csproj `
            --configuration Release `
            --framework net10.0-windows10.0.19041.0 `
            --output artifacts/msix-signed

          Write-Host "MSIX packages ready in artifacts/msix-signed"
          Write-Host "Note: MSIX signing requires WixToolset or signtool with the certificate"

      - name: Upload Windows packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            artifacts/msix-unsigned/**
            artifacts/msix-signed/**
          if-no-files-found: ignore

  verify-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install EF tools
        run: dotnet tool install --global dotnet-ef --version 10.0.9

      # `dotnet ef` builds the project it is pointed at, and a build with no
      # assets file fails with NETSDK1004 before it ever reads the model. This
      # job never restored, so it had been failing on that rather than on a
      # pending migration.
      - name: Restore
        run: dotnet restore src/Pos.Infrastructure/Pos.Infrastructure.csproj

      # A model change without a matching migration is the classic way a schema
      # drifts from the code that assumes it. The server and device databases
      # have separate contexts and migration sets, so each is checked.
      - name: Fail if the model has uncommitted migrations
        run: |
          for context in PosDbContext PosDeviceDbContext; do
            dotnet ef migrations has-pending-model-changes \
              --context "$context" \
              --project src/Pos.Infrastructure/Pos.Infrastructure.csproj \
              --startup-project src/Pos.Infrastructure/Pos.Infrastructure.csproj
          done

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked files for secrets
        run: pwsh ./scripts/check-secrets.ps1

  publish-images:
    # Only publish on main branch to avoid uncontrolled image proliferation from PRs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build-and-test, verify-migrations, secret-scan]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata (API)
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/pos-api
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./build/docker/Dockerfile.api
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate image metadata (Web)
        id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/pos-web
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./build/docker/Dockerfile.web
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
