name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Pos.Client targets Android and Windows and needs the MAUI workloads,
      # which this runner does not have; the build-client jobs build it.
      # Removing it from this checkout's solution, rather than listing what to
      # build, means any project added later is still built and tested here.
      - name: Leave the device client to its own job
        run: dotnet sln VaultFlow.slnx remove src/Pos.Client/Pos.Client.csproj

      - name: Restore
        run: dotnet restore VaultFlow.slnx

      # Warnings are errors, and NU1903 fails the build on a package with a
      # published advisory, so a vulnerable dependency cannot merge unnoticed.
      - name: Build
        run: dotnet build VaultFlow.slnx --no-restore --configuration Release

      # Docker is available on this runner, so the Testcontainers suites that
      # skip locally do run here. They are the only place the database triggers
      # and role grants are actually exercised.
      - name: Test
        run: >-
          dotnet test VaultFlow.slnx
          --no-build --configuration Release
          --settings coverlet.runsettings
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/test-results

      # Collecting coverage and never looking at it is how a suite rots while
      # the badge stays green. The floors live in the script, a couple of points
      # under what the suite covers today, so only a real regression trips them.
      - name: Check coverage floors
        run: pwsh ./scripts/check-coverage.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results

  # DEPLOYMENT.md §8: the client builds only once the shared projects have
  # built and passed their tests, Android on Linux and Windows on Windows.
  # Workloads are pinned to the workload set matching global.json, so a new MAUI
  # or Android release cannot change these builds without a commit. Release runs
  # the Android trimmer, whose warnings are errors like every other warning.
  build-client-android:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Installed under the runner's temp directory rather than /usr/share/dotnet,
      # so installing a workload needs no elevated rights.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          global-json-file: global.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android --version 10.0.301

      # Tops up the runner's Android SDK with what this target needs, so the
      # build does not depend on which platforms the runner image carries.
      - name: Install Android dependencies
        run: >-
          dotnet build src/Pos.Client/Pos.Client.csproj
          -t:InstallAndroidDependencies
          -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:JavaSdkDirectory="$JAVA_HOME"
          -p:AcceptAndroidSDKLicenses=True

      - name: Build
        run: >-
          dotnet build src/Pos.Client/Pos.Client.csproj
          --configuration Release
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:JavaSdkDirectory="$JAVA_HOME"

  build-client-windows:
    needs: build-and-test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install the MAUI Windows workload
        run: dotnet workload install maui-windows --version 10.0.301

      - name: Build
        run: >-
          dotnet build src/Pos.Client/Pos.Client.csproj
          --configuration Release
          --framework net10.0-windows10.0.19041.0

  verify-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install EF tools
        run: dotnet tool install --global dotnet-ef --version 10.0.9

      # `dotnet ef` builds the project it is pointed at, and a build with no
      # assets file fails with NETSDK1004 before it ever reads the model. This
      # job never restored, so it had been failing on that rather than on a
      # pending migration.
      - name: Restore
        run: dotnet restore src/Pos.Infrastructure/Pos.Infrastructure.csproj

      # A model change without a matching migration is the classic way a schema
      # drifts from the code that assumes it. The server and device databases
      # have separate contexts and migration sets, so each is checked.
      - name: Fail if the model has uncommitted migrations
        run: |
          for context in PosDbContext PosDeviceDbContext; do
            dotnet ef migrations has-pending-model-changes \
              --context "$context" \
              --project src/Pos.Infrastructure/Pos.Infrastructure.csproj \
              --startup-project src/Pos.Infrastructure/Pos.Infrastructure.csproj
          done

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked files for secrets
        run: pwsh ./scripts/check-secrets.ps1
