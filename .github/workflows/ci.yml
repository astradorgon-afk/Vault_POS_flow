name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Pos.Client targets Android and Windows and needs the MAUI workloads,
      # which this runner does not have; the build-client jobs build it.
      # Removing it from this checkout's solution, rather than listing what to
      # build, means any project added later is still built and tested here.
      - name: Leave the device client to its own job
        run: dotnet sln VaultFlow.slnx remove src/Pos.Client/Pos.Client.csproj

      - name: Restore
        run: dotnet restore VaultFlow.slnx

      # Warnings are errors, and NU1903 fails the build on a package with a
      # published advisory, so a vulnerable dependency cannot merge unnoticed.
      - name: Build
        run: dotnet build VaultFlow.slnx --no-restore --configuration Release

      # Docker is available on this runner, so the Testcontainers suites that
      # skip locally do run here. They are the only place the database triggers
      # and role grants are actually exercised.
      - name: Test
        run: >-
          dotnet test VaultFlow.slnx
          --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/test-results

      - name: Enforce coverage gate
        shell: pwsh
        run: ./scripts/check-coverage.ps1 -Path artifacts/test-results -MinimumLineRate 0.60

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results

  # DEPLOYMENT.md §8: the client builds only once the shared projects have
  # built and passed their tests, Android on Linux and Windows on Windows.
  # Workloads are pinned to the workload set matching global.json, so a new MAUI
  # or Android release cannot change these builds without a commit. Release runs
  # the Android trimmer, whose warnings are errors like every other warning.
  build-client-android:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Installed under the runner's temp directory rather than /usr/share/dotnet,
      # so installing a workload needs no elevated rights.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          global-json-file: global.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android --version 10.0.301

      # Tops up the runner's Android SDK with what this target needs, so the
      # build does not depend on which platforms the runner image carries.
      - name: Install Android dependencies
        run: >-
          dotnet build src/Pos.Client/Pos.Client.csproj
          -t:InstallAndroidDependencies
          -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:JavaSdkDirectory="$JAVA_HOME"
          -p:AcceptAndroidSDKLicenses=True

      - name: Build
        run: >-
          dotnet build src/Pos.Client/Pos.Client.csproj
          --configuration Release
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:JavaSdkDirectory="$JAVA_HOME"

      # This is intentionally an unsigned candidate. Store-ready AAB signing
      # requires repository secrets and a release keystore, so it is kept out
      # of the normal validation workflow.
      - name: Publish unsigned Android candidate
        run: >-
          dotnet publish src/Pos.Client/Pos.Client.csproj
          --configuration Release
          --framework net10.0-android
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=false
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:JavaSdkDirectory="$JAVA_HOME"

      - name: Upload Android candidate
        uses: actions/upload-artifact@v4
        with:
          name: vaultflow-android-unsigned-${{ github.sha }}
          path: artifacts/bin/Pos.Client/release_net10.0-android/**/com.vaultflow.pos.apk
          if-no-files-found: error
          retention-days: 14

  build-client-windows:
    needs: build-and-test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install the MAUI Windows workload
        run: dotnet workload install maui-windows --version 10.0.301

      - name: Build
        run: >-
          dotnet build src/Pos.Client/Pos.Client.csproj
          --configuration Release
          --framework net10.0-windows10.0.19041.0

      # WindowsPackageType is currently None, so this is an unpackaged
      # validation handoff rather than a signed MSIX release.
      - name: Publish unpackaged Windows candidate
        run: >-
          dotnet publish src/Pos.Client/Pos.Client.csproj
          --configuration Release
          --framework net10.0-windows10.0.19041.0

      - name: Upload Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: vaultflow-windows-unpackaged-${{ github.sha }}
          path: artifacts/bin/Pos.Client/release_net10.0-windows10.0.19041.0/**
          if-no-files-found: error
          retention-days: 14

  verify-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install EF tools
        run: dotnet tool install --global dotnet-ef --version 10.0.9

      # A model change without a matching migration is the classic way a schema
      # drifts from the code that assumes it. The server and device databases
      # have separate contexts and migration sets, so each is checked.
      - name: Fail if the model has uncommitted migrations
        run: |
          for context in PosDbContext PosDeviceDbContext; do
            dotnet ef migrations has-pending-model-changes \
              --context "$context" \
              --project src/Pos.Infrastructure/Pos.Infrastructure.csproj \
              --startup-project src/Pos.Infrastructure/Pos.Infrastructure.csproj
          done

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked files for secrets
        run: pwsh ./scripts/check-secrets.ps1

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image metadata
        id: meta
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/vaultflow-api:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/vaultflow-api:latest
      - name: Build and publish Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/vaultflow-web:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/vaultflow-web:latest
