<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>VaultFlow POS</title>
    <base href="/" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="Pos.Client.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>

    <script>
        // Focus a field and select its text. ElementReference has no built-in
        // select, so the register components ask the window for it (scan/repeat
        // entries and quantity edits depend on typing replacing the old value).
        window.VaultFlowRegister = {
            focusSelect: function (element) {
                if (!element) { return; }
                try { element.focus(); element.select(); } catch (_) { /* readonly/disconnected inputs */ }
            }
        };
    </script>

</body>

</html>
