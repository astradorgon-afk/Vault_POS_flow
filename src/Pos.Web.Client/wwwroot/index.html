<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#153c2b" />
    <title>VaultFlow</title>
    <base href="/" />
    <style>
        body { margin: 0; background: #f5f4ee; color: #173324; font-family: system-ui, sans-serif; }
        .startup { max-width: 520px; margin: 12vh auto; padding: 28px; }
        .startup-brand { font-size: 1.3rem; font-weight: 750; color: #175637; }
        .startup h1 { font-size: 1.7rem; line-height: 1.2; }
        .startup p { line-height: 1.6; }
        .startup a { color: #175637; }
        .loading-progress { width: 64px; height: 64px; margin-top: 24px; transform: rotate(-90deg); }
        .loading-progress circle { fill: none; stroke: #dce5dc; stroke-width: 7px; }
        .loading-progress circle:last-child { stroke: #175637; stroke-dasharray: calc(3.14159 * var(--blazor-load-percentage, 0%) * .8), 500%; }
        .loading-progress-text::after { content: var(--blazor-load-percentage-text, "Preparing download"); }
        .startup button { padding: 12px 20px; border: 0; border-radius: 9px; background: #175637; color: white; font: inherit; cursor: pointer; }
        #blazor-error-ui { display: none; position: fixed; bottom: 16px; left: 16px; right: 16px; padding: 16px; background: #fff0ec; color: #912e20; border-radius: 9px; z-index: 1000; }
        #pwa-cache-warning:not([hidden]) { padding: 14px 20px; background: #fff4d9; color: #604711; line-height: 1.5; }
    </style>
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/offline/css/offline.css" />
    <link rel="stylesheet" href="/offline/css/workspace.css" />
    <link rel="stylesheet" href="/_content/Pos.SharedUI/login.css" />
    <link rel="icon" type="image/png" href="/offline/favicon.png" />
    <link href="/manifest.webmanifest?v=2" rel="manifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" sizes="512x512" href="/offline/icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/offline/icon-192.png" />
</head>

<body>
    <div id="app">
        <section class="startup" aria-labelledby="startup-title">
        <div class="startup-brand">V · VaultFlow</div>
        <h1 id="startup-title">Opening your workspace</h1>
        <p id="startup-status" role="status">Downloading the app for this browser. The first visit can take a little longer on slow Wi-Fi.</p>
        <svg class="loading-progress" aria-hidden="true">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
        <p><a href="/login">Open VaultFlow online</a></p>
        <button id="startup-retry" type="button" hidden>Try again</button>
        </section>
    </div>

    <div id="pwa-cache-warning" role="status" hidden></div>

    <div id="blazor-error-ui">
        VaultFlow could not continue. Reconnect and reload. If browser data was cleared, work saved only on this device may have been lost.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="/offline/js/scan-audio.js"></script>
    <script src="/offline/js/pwa-install.js"></script>
    <script src="/offline/_framework/blazor.webassembly.js" autostart="false"></script>
    <script src="/offline/js/pwa-boot.js"></script>
</body>

</html>
