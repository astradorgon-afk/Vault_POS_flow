# Public demo overlay (https://vaultflow.fyi). Start with:
# docker compose -f compose.yaml -f compose.prod.yaml -f compose.demo.yaml --profile tunnel up -d --build
#
# Only the web host is reachable from outside, and only through the Cloudflare
# tunnel. The API, Postgres and the Caddy proxy (whose /api route would expose
# the raw API) are not published.
#
# Demo data, once, with DEMO_ACCOUNT_PASSWORD (12+ characters) set in .env:
#   DEMO_SEED=true docker compose ... up -d api
#   docker compose ... --profile seed run --rm demodata
#   docker compose ... up -d api     (seeding off again, so restarts keep passwords people change)
services:
  proxy:
    profiles: ["disabled"]

  api:
    environment:
      # compose.yaml passes the bootstrap password but not the name to create.
      BootstrapOwner__UserName: owner
      # The web login cannot enrol an authenticator, so admins could not sign
      # in at all with this on.
      Security__RequireTwoFactorForAdmins: "false"
      # The demo starts on owner / cash1234. The API refuses that password a
      # session and makes the first sign-in choose a new one; once replaced,
      # restarts never put the default back.
      DefaultOwnerPassword__Enabled: "true"
      DefaultOwnerPassword__UserName: owner
      DefaultOwnerPassword__Password: cash1234
      # No length or character rules on the demo; a password only has to be non-empty.
      Security__MinimumPasswordLength: "1"
      Database__SeedDevelopmentData: ${DEMO_SEED:-false}
      Seeding__EnableDevelopmentAccounts: ${DEMO_SEED:-false}
      Seeding__DevelopmentAccountPassword: ${DEMO_ACCOUNT_PASSWORD:-}

  web:
    environment:
      # A device manager's sign-in sets the browser up for offline use without
      # asking for an enrollment code; the device still shows under Devices.
      DeviceEnrolment__AutoEnrol: "true"
      # The tunnel terminates HTTPS and reaches the container from the Docker
      # bridge, not loopback, so X-Forwarded-Proto is ignored by default and
      # the app thinks it is serving http. The offline gateway then refuses
      # every PWA request, because the browser's https Origin does not match.
      # Safe to trust: the container is only reachable through 127.0.0.1:5400.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    ports:
      # Loopback only. The tunnel (on the host network) is the sole public way in.
      - "127.0.0.1:5400:8080"

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: always
    # The dashboard rejects bare service names like web:8080, so the route
    # targets http://localhost:5400 and the tunnel shares the host's loopback.
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      # Compose interpolates this even while the profile is off, so it cannot be required.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - web

  demodata:
    image: mcr.microsoft.com/dotnet/sdk:10.0-alpine
    profiles: ["seed"]
    # The host user, so the build output in the checkout stays editable.
    user: "${DEMO_UID:-1000}"
    working_dir: /src
    environment:
      HOME: /tmp
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      VAULTFLOW_DEMO_PASSWORD: ${DEMO_ACCOUNT_PASSWORD:-}
    volumes:
      - .:/src
    command: ["dotnet", "run", "--project", "tools/Pos.DemoData", "--configuration", "Release", "--", "--api", "http://api:8080", "--days", "${DEMO_DAYS:-30}"]
    depends_on:
      - api
