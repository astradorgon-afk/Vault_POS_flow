name: vaultflow-worker

services:
  web:
    image: ${VAULTFLOW_WEB_IMAGE:?Use the exact web image exported from the main laptop}
    restart: unless-stopped
    network_mode: host
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://127.0.0.1:5402
      Api__BaseAddress: http://100.98.212.11:5480
      DeviceEnrolment__AutoEnrol: "true"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    volumes:
      - web-keys:/app/keys
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5402/"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  ingress:
    image: ${HAPROXY_IMAGE:?Set the tested HAProxy image digest in homelab.env}
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./build/docker/homelab-worker.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      web:
        condition: service_healthy

volumes:
  web-keys:
