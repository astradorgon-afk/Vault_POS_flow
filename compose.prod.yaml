# Production overlay. Start with:
# docker compose -f compose.yaml -f compose.prod.yaml up -d --build
services:
  postgres:
    ports: !reset []
    restart: always
  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    restart: always
  web:
    build:
      context: .
      dockerfile: build/docker/Dockerfile.web
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      Api__BaseAddress: http://api:8080
      # Caddy, and the Cloudflare tunnel in compose.demo.yaml, reach the web host
      # from this stack's Docker network, whose range Docker picks from these.
      # Trusting them lets the visitor's address through to the API's sign-in
      # limits. The web port is never published beyond the host, so nothing
      # outside the stack can claim an address this way.
      ForwardedHeaders__KnownNetworks__0: 172.16.0.0/12
      ForwardedHeaders__KnownNetworks__1: 192.168.0.0/16
    volumes:
      - dataprotection-keys:/app/keys
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_started
    expose:
      - "8080"
  proxy:
    restart: always
    volumes:
      - ./build/docker/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
