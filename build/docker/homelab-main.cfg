global
    log stdout format raw local0
    maxconn 2048

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 130s
    timeout server 130s
    timeout http-request 15s
    timeout http-keep-alive 15s
    timeout tunnel 1h

resolvers docker
    nameserver docker 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

# Cloudflared is the only published entry point, via host loopback.
frontend website
    bind :8080
    http-request set-header X-Forwarded-Proto https
    default_backend website_nodes

backend website_nodes
    balance roundrobin
    option redispatch
    option httpchk
    http-check send meth GET uri /login hdr Host vaultflow.fyi
    http-check expect status 200
    cookie vaultflow.route insert indirect nocache httponly secure attr SameSite=Lax
    # Web sessions, PWA handoffs, antiforgery tokens and Blazor circuits are
    # process-local. Keep ALL paths on the selected node, including /_blazor.
    http-response set-header X-VaultFlow-Node %[srv_name]
    server main web:8080 cookie main weight 2 check inter 3s fall 3 rise 2 resolvers docker init-addr libc,none
    server worker 100.74.92.104:5403 cookie worker weight 1 check inter 3s fall 3 rise 2

# Loopback-only relay for the host-network api-link's source allowlist.
frontend worker_api
    bind :8081
    default_backend existing_api

backend existing_api
    server api api:8080 check resolvers docker init-addr libc,none

# Published on loopback only. JSON/CSV stats expose routing and backend health.
listen local_stats
    bind :8082
    stats enable
    stats uri /stats
    stats refresh 10s
