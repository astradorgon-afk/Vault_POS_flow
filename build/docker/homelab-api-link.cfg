global
    log stdout format raw local0
    maxconn 512

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 130s
    timeout server 130s
    timeout http-request 15s

# Encrypted Tailscale access from the worker laptop only. Host networking is
# necessary here: Docker's port proxy can hide the original source address.
frontend worker_only
    bind 100.98.212.11:5480
    acl worker_node src 100.74.92.104
    http-request deny deny_status 403 unless worker_node
    default_backend api_relay

backend api_relay
    server relay 127.0.0.1:5481 check
