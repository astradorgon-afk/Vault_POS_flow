global
    log stdout format raw local0
    maxconn 1024

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 130s
    timeout server 130s
    timeout http-request 15s
    timeout http-keep-alive 15s
    timeout tunnel 1h

frontend main_laptop_only
    bind 100.74.92.104:5403
    acl main_node src 100.98.212.11
    http-request deny deny_status 403 unless main_node
    http-request set-header X-Forwarded-Proto https
    default_backend local_web

backend local_web
    server web 127.0.0.1:5402 check
